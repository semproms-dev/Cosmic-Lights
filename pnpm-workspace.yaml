packages:
  - 'apps/*'

# Pulled in by @huggingface/transformers, but only used when it runs under Node.
# CosmicLights runs it in the browser (WebGPU/WASM), so none of these need to build.
allowBuilds:
  '@swc/core': true
  unrs-resolver: true
  onnxruntime-node: false
  protobufjs: false
  sharp: false
